<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>matar demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font:
          13px/1.35 ui-monospace,
          Menlo,
          monospace;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      #view canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        gap: 8px;
        padding: 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        justify-content: center;
      }
      button {
        font: inherit;
        font-size: 16px;
        padding: 10px 18px;
        border-radius: 8px;
        border: 0;
        background: #f2f2f2;
        color: #111;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        margin: 0;
        padding: 6px 8px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        white-space: pre;
        max-width: calc(100vw - 32px);
        overflow: hidden;
      }
      #report {
        position: fixed;
        left: 8px;
        right: 8px;
        top: 8px;
        height: 60vh;
        font: inherit;
        font-size: 12px;
        background: #000;
        color: #eee;
        display: none;
      }
      #thumb {
        position: fixed;
        right: 8px;
        top: 8px;
        border: 1px solid #666;
        image-rendering: pixelated;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <pre id="hud">matar demo: print the board, then press Start.</pre>
    <canvas id="thumb"></canvas>
    <textarea id="report" readonly aria-label="Timing report"></textarea>
    <div id="bar">
      <button id="print" type="button">Print board</button>
      <button id="start" type="button">Start</button>
      <button id="mode" type="button" style="display: none">Mode</button>
      <button id="copy" type="button" style="display: none">Copy report</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
